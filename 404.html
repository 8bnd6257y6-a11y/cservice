<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — C. Service SNC</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1A1513">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 48px 24px; background: var(--dark); color: var(--cream);
  }
  .nf__logo { height: 132px; width: auto; margin-bottom: 34px; opacity: .95; }
  .nf__code {
    font-family: var(--serif); font-weight: 300; font-size: clamp(3.4rem, 9vw, 6rem);
    line-height: 1; letter-spacing: -.03em; color: var(--wine); margin-bottom: 10px;
  }
  .nf h1 {
    font-family: var(--serif); font-weight: 300; font-size: clamp(1.5rem, 3vw, 2.2rem);
    line-height: 1.15; letter-spacing: -.02em; color: var(--cream); margin-bottom: 12px;
  }
  .nf p { color: rgba(251, 245, 234, .68); font-size: .98rem; max-width: 42ch; }
  .nf .btn { margin-top: 30px; background: var(--wine); color: var(--cream); border-color: var(--wine); }
  .nf .btn:hover { background: var(--wine-hi); border-color: var(--wine-hi); }
  .nf__links { margin-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .nf__links a { color: rgba(251, 245, 234, .6); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
  .nf__links a:hover { color: var(--cream); }
</style>
</head>
<body>
  <main class="nf">
    <img class="nf__logo" src="/assets/img/logo-full-light.png" alt="C. Service SNC — di Alberto Cugnetto &amp; C." width="190" height="251">
    <p class="nf__code">404</p>
    <h1>Questa pagina non esiste.</h1>
    <p>Il link potrebbe essere vecchio o la pagina essere stata spostata. Dalla home trovi profilo, servizi, pubblicazioni e contatti.</p>
    <a class="btn btn--solid" href="/">Torna alla home</a>
    <nav class="nf__links" aria-label="Collegamenti utili">
      <a href="/#winemaking">Enologia</a>
      <a href="/#viticulture">Viticoltura</a>
      <a href="/#pubblicazioni">Pubblicazioni</a>
      <a href="/#contact">Contatti</a>
    </nav>
  </main>
</body>
</html>
